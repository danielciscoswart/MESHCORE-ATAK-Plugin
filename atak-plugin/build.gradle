ext.ATAK_VERSION = '5.6.0'

buildscript {
    def properties = new Properties()
    def local = file('local.properties')
    if (local.isFile()) {
        def reader = local.newReader('UTF-8')
        try {
            properties.load(reader)
        } finally {
            reader.close()
        }
    }
    def takdevPath = properties.getProperty('takdev.plugin')
    if (takdevPath == null || !new File(takdevPath).isFile()) {
        throw new GradleException('takdev.plugin in atak-plugin/local.properties must be the local atak-gradle-takdev.jar from the ATAK-CIV 5.6.0.26 SDK. Do not commit that jar.')
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath files(takdevPath)
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
